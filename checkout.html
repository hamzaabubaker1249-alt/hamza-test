<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - FLASH CARDS</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 120px auto 60px;
            padding: 0 2rem;
        }
        
        .checkout-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 3rem;
            backdrop-filter: blur(10px);
        }
        
        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .checkout-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .order-summary {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--primary);
        }
        
        .contact-info {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.1), rgba(58, 123, 213, 0.1));
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }
        
        .phone-display {
            font-size: 3rem;
            font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 1rem 0;
            display: block;
        }
        
        .contact-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
        
        .success-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">
                    <span class="lightning"></span>
                </div>
                <div class="logo-text">
                    <h1>FLASH CARDS</h1>
                </div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">الرئيسية</a></li>
                <li><a href="shop.html" class="nav-link">المتجر</a></li>
            </ul>
        </div>
    </nav>

    <div class="checkout-container">
        <div class="checkout-box">
            <div class="checkout-header">
                <div class="success-icon">✅</div>
                <h1>خطوة واحدة فقط!</h1>
                <p>لإتمام طلبك، يرجى التواصل معنا مباشرة</p>
            </div>
            
            <div class="order-summary" id="orderSummary">
                <!-- Order items loaded by JavaScript -->
            </div>
            
            <div class="contact-info">
                <h2>📞 تواصل معنا الآن</h2>
                <p>اضغط على الزر أدناه للتواصل المباشر</p>
                <span class="phone-display">0917511511</span>
                
                <div class="contact-buttons">
                    <a href="tel:0917511511" class="btn btn-primary btn-lg">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        اتصال مباشر
                    </a>
                    <a href="https://wa.me/218917511511" class="btn btn-whatsapp btn-lg" target="_blank">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                        </svg>
                        واتساب
                    </a>
                </div>
                
                <p style="margin-top: 2rem; color: var(--text-muted);">
                     متواجدون على مدار الساعة
                </p>
            </div>
        </div>
    </div>

    <script src="js/cart.js"></script>
    <script>
        // Load order summary
        function loadOrderSummary() {
            const checkoutData = JSON.parse(localStorage.getItem('flashcards_checkout')) || [];
            const summary = document.getElementById('orderSummary');
            
            if (checkoutData.length === 0) {
                summary.innerHTML = '<p style="text-align: center; padding: 2rem;">لا يوجد طلبات</p>';
                return;
            }
            
            const total = checkoutData.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            summary.innerHTML = `
                <h2 style="margin-bottom: 1.5rem;">📋 ملخص الطلب</h2>
                ${checkoutData.map(item => `
                    <div class="order-item">
                        <span>${item.icon} ${item.name} × ${item.quantity}</span>
                        <span>${(item.price * item.quantity)} دينار</span>
                    </div>
                `).join('')}
                <div class="order-total">
                    <span>الإجمالي:</span>
                    <span>${total} دينار</span>
                </div>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', loadOrderSummary);
    </script>
</body>
</html>
