<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر - FLASH CARDS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">
                    <span class="lightning">⚡</span>
                </div>
                <div class="logo-text">
                    <h1>FLASH CARDS</h1>
                </div>
            </div>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">الرئيسية</a></li>
                <li><a href="shop.html" class="nav-link active">المتجر</a></li>
                <li><a href="contact.html" class="nav-link">تواصل معنا</a></li>
            </ul>

            <div class="nav-actions">
                <button class="cart-btn" id="cartBtn" onclick="openCart()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main style="padding: 120px 0 60px;">
        <div class="container">
            <h1 class="section-title">جميع المنتجات</h1>
            
            <div class="products-grid" id="allProducts">
                <!-- All products loaded by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Cart Sidebar (same as index.html) -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-overlay" onclick="closeCart()"></div>
        <div class="cart-content">
            <div class="cart-header">
                <h2>سلة المشتريات</h2>
                <button class="close-cart" onclick="closeCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>الإجمالي:</span>
                    <span id="cartTotal">0 دينار</span>
                </div>
                <button class="btn btn-primary btn-full" onclick="checkout()">
                    إتمام الشراء
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Load all products
        function loadAllProducts() {
            const container = document.getElementById('allProducts');
            if (!container) return;
            
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    ${product.badge ? `<span class="product-badge">${product.badge}</span>` : ''}
                    <div class="product-icon">${product.icon}</div>
                    <h3 class="product-title">${product.name}</h3>
                    <p class="product-desc">${product.desc}</p>
                    <div class="product-price">${product.price} دينار</div>
                    <div class="product-actions">
                        <button class="btn btn-primary btn-full" onclick="addToCartById('${product.id}')">
                            أضف للسلة
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', loadAllProducts);
    </script>
</body>
</html>
