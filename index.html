<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع متاح للإيجار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        p {
            color: #4a5568;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .phone-box {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            box-shadow: 0 10px 25px rgba(67, 233, 123, 0.3);
        }

        .phone-label {
            color: #1a202c;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .phone-number {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            direction: ltr;
            letter-spacing: 2px;
        }

        .call-btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            margin: 10px 5px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        .call-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-btn {
            background: #25D366;
        }

        .phone-btn {
            background: #3b82f6;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .phone-btn:hover {
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.6);
        }

        .footer {
            margin-top: 30px;
            color: #718096;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 24px; }
            p { font-size: 16px; }
            .phone-number { font-size: 22px; }
            .icon { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏢</div>
        <span class="badge">🔥 متاح للإيجار</span>
        <h1>هذا الموقع متاح للإيجار</h1>
        <p>
            مرحباً بك! إذا كنت مهتماً باستئجار هذا الموقع الإلكتروني،
            يرجى التواصل معنا عبر الرقم أدناه للاتفاق على التفاصيل.
        </p>

        <div class="phone-box">
            <div class="phone-label">📞 للتواصل والاستفسار</div>
            <div class="phone-number">+218 92 616 4068</div>
        </div>

        <div>
            <a href="tel:+218926164068" class="call-btn phone-btn">📞 اتصل الآن</a>
            <a href="https://wa.me/218926164068" target="_blank" class="call-btn whatsapp-btn">💬 واتساب</a>
        </div>

        <div class="footer">
            © 2026 - شكراً لزيارتكم
        </div>
    </div>
</body>
</html>
